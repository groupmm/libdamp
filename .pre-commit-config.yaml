repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      # ruff-format is intentionally not enabled here: the codebase isn't (yet) fully
      # ruff-formatted, and enabling it would reformat any file as soon as it's touched,
      # producing large, unrelated diffs. Run `uv run ruff format .` manually if/when the
      # codebase is brought in line with ruff's formatting style project-wide.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
