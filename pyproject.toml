[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name =  "libdamp"
authors = [
    {name = "Simon Schwär", email = "simon.schwaer@audiolabs-erlangen.de"},
    {name = "Manuel Peters", email = "manuel.peters@audiolabs-erlangen.de"},
    {name = "Meinard Müller", email = "meinard.mueller@audiolabs-erlangen.de"},
]
description = "Framework for experiments with differentiable audio and music processing in PyTorch"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "gin-config >= 0.5",
    "lightning >= 2.0",
    "mlflow >= 3.10.0",
    "numpy >= 1.17.0, < 2.0.0",
    "torch >= 2.0",
    "torchaudio >= 2.0",
    "scipy >= 1.11.1",
    "soundfile >= 0.13.1",
]

[project.optional-dependencies]
tests = [
    "pytest==9.0.2",
]
develop = [
    "ruff>=0.15.0",
    "pre-commit==3.3.1",
]
doc = ["sphinx"]
notebooks = [
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "mir_eval>=0.8.0",
]


[project.urls]
Home = "https://github.com/groupmm/libdamp"

[project.scripts]
libdamp-run = "scripts.run:run"
libdamp-prepare-pulseit-data = "scripts.prepare_pulseit_data:main"

[tool.hatch.version]
path = "libdamp/version.py"

[tool.hatch.build.targets.wheel]
packages = ["libdamp", "scripts"]


[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["libdamp/models/lstm.py", "libdamp/models/resnet.py"]  # vendored third-party code

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modern syntax)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B006",   # mutable-argument-default: libdamp intentionally uses [] as a default in a few places
    "E731",   # lambda-assignment: used occasionally for short helper functions
    "SIM102", # collapsible-if: nested ifs are used deliberately to attach an explanatory comment
              # to the inner condition (e.g. "if batch size changed, reset state")
    "SIM108", # if-else-block-instead-of-if-exp: ternaries are avoided here for longer conditions/branches
]

[tool.ruff.lint.isort]
known-first-party = ["libdamp"]

[tool.ruff.lint.per-file-ignores]
"libdamp/__init__.py" = ["F401", "F403", "I001"]  # intentional flat re-export of every submodule's public API
"test/**/*.py" = ["B011"]  # assert False is used deliberately in a few tests
